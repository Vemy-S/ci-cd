name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - run: go mod download
      - run: go test -v ./...

      - name: Railway CLI
        run: npm install -g @railway/cli

      - name: Deployment
        run: railway up --detach --project "77342a0a-c099-43a8-9ac2-52c3dcd68e8e"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
